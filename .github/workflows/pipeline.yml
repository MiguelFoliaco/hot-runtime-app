name: Deployment Pipeline

on:
    push:
        branches:
            - Main
        
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
              with:
                fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                node-version: '20.x'
            - name: Navegate path frontend and Install depends
              run: cd packages/frontend && npm install --no-audit --no-found 
            - name: Run lint
              run: cd packages/frontend && npm run lint


